name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Version gegen Tag prüfen
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="$(python -c 'from app.version import APP_VERSION; print(APP_VERSION)')"

          echo "Projektversion: ${VERSION}"
          echo "Git-Tag: ${GITHUB_REF_NAME}"

          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Die Projektversion v${VERSION} stimmt nicht mit dem Tag ${GITHUB_REF_NAME} überein."
            exit 1
          fi

      - name: Prüfen und Release-Pakete erstellen
        run: python release.py

      - name: Release-Dateien anzeigen
        shell: bash
        run: |
          echo "Erstellte Release-Dateien:"
          ls -lh release/

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES_PENDING.md
          files: |
            release/*.zip
            release/*.sha256
          fail_on_unmatched_files: true

      - name: Temporäre Release-Notizen entfernen
        if: success() && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B main origin/main

          if [ ! -f "RELEASE_NOTES_PENDING.md" ]; then
            echo "RELEASE_NOTES_PENDING.md wurde bereits entfernt."
            exit 0
          fi

          git rm RELEASE_NOTES_PENDING.md
          git commit -m "Temporäre Release-Notizen nach ${GITHUB_REF_NAME} entfernen"

          for attempt in 1 2 3; do
            echo "Push-Versuch ${attempt} von 3"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Temporäre Release-Notizen wurden erfolgreich entfernt."
              exit 0
            fi

            echo "Der Hauptzweig wurde zwischenzeitlich geändert."
            echo "Neuer Push-Versuch folgt."
            sleep 5
          done

          echo "::warning::Das Release wurde erfolgreich erstellt, aber RELEASE_NOTES_PENDING.md konnte nicht automatisch entfernt werden."
          echo "Die Datei muss vor dem nächsten Release manuell entfernt oder ersetzt werden."
          exit 0
